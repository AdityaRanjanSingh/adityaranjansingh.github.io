---
layout: default
title: Projects
---
<h1>Projects</h1>
<ul class="project-list">
  {% for project in site.data.projects %}
  <li class="project-item">
    <h2><a href="{{ project.link }}">{{ project.name }}</a></h2>
    <p>{{ project.description }}</p>
    <p class="tags">
      {% for tag in project.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </p>
  </li>
  {% endfor %}
</ul>
